<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MISS KOUYATE SHOP — application de gestion de boutique : ventes, dépenses, stock de gaz, bénéfices et rentabilité par activité.">
<meta name="theme-color" content="#0d9488">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MISS KOUYATE SHOP — Gestion de boutique</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#1b2430;--mut:#64748b;--line:#e5e9f0;--pri:#e8590c;--pri2:#c2410c;--tea:#0d9488;--grn:#16a34a;--red:#dc2626;--blu:#2563eb;--amb:#d97706;--rad:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px;font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 16px}
@media(min-width:900px){.wrap{max-width:1080px}}
header.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
header.top .t1{font-weight:800;font-size:17px}
header.top .t2{font-size:12px;opacity:.88}
h2.sec{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px}
.kpi .l{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:19px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;word-break:break-word}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.v.good{color:var(--grn)}.v.bad{color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);border:1px solid var(--line);min-height:46px;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn-pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn-pri:active{background:var(--pri2)}
.btn-ghost{background:#f1f5f9;border-color:transparent;color:#334155}
.btn-danger{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.btn-sm{padding:8px 12px;font-size:13.5px;min-height:38px;border-radius:10px}
.btn-block{width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;color:#475569;font-family:inherit}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{color:var(--mut);font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid #eef1f5}
.tbl tr:last-child td{border-bottom:none}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #eef1f5;align-items:center}
.row:last-child{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.b-esp{background:#dcfce7;color:#15803d}.b-mm{background:#dbeafe;color:#1d4ed8}.b-cred{background:#ffedd5;color:#c2410c}
.pill{display:inline-block;background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;background:none;border:none;padding:8px 0 6px;font-size:10.5px;color:#64748b;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav.bottom button .ico{font-size:20px}
nav.bottom button.on{color:var(--tea);font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media(min-width:640px){.overlay{align-items:center}}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;max-height:90vh;overflow:auto;display:flex;flex-direction:column;animation:up .18s}
@media(min-width:640px){.sheet{border-radius:18px;max-height:86vh}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.sheet-head h3{margin:0;font-size:16px;flex:1}
.icon-btn{background:#f1f5f9;border:none;border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer;color:#475569;flex:none}
.sheet-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.sheet-foot{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-foot .btn{flex:1}
.field label{display:block;font-size:12.5px;font-weight:700;color:#475569;margin-bottom:5px}
.inp{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:11px 12px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
.inp:focus{outline:2px solid #99f6e4;border-color:var(--tea)}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font-size:13px;font-weight:700;cursor:pointer;color:#475569;font-family:inherit}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.prod-grid{grid-template-columns:repeat(3,1fr)}}
.prod{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;font-size:14px;font-family:inherit}
.prod:active{transform:scale(.98);border-color:var(--tea)}
.prod .n{font-weight:700}
.prod .p{color:var(--pri);font-weight:800;font-size:15px;margin-top:2px}
.prod .k{font-size:10.5px;color:var(--mut);margin-top:3px}
.qty-ctl{display:flex;align-items:center;gap:8px}
.qty-ctl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700;cursor:pointer;flex:none;color:var(--ink)}
.qty-ctl .inp{text-align:center;font-weight:800}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eef1f5}
.list-item:last-child{border-bottom:none}
.del{background:none;border:none;color:#cbd5e1;font-size:16px;cursor:pointer;padding:4px;flex:none;font-family:inherit}
.del:active{color:var(--red)}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
.empty .e{font-size:34px;display:block;margin-bottom:6px}
.date-head{font-weight:800;font-size:12.5px;color:var(--mut);margin:12px 0 2px;text-transform:capitalize}
.hint{font-size:12.5px;color:var(--mut)}
.alert{display:flex;gap:8px;align-items:flex-start;background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:8px}
.alert.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw;text-align:center;animation:tin .2s}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes tin{from{opacity:0;margin-top:-8px}to{opacity:1;margin-top:0}}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .bar{width:100%;max-width:46px;background:linear-gradient(180deg,#2dd4bf,#0d9488);border-radius:6px 6px 2px 2px;min-height:3px}
.chart .lab{font-size:10px;color:var(--mut);font-weight:700}
.chart .val{font-size:9.5px;color:var(--mut)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 10px;cursor:pointer;text-align:center;font-family:inherit}
.menu-item .e{font-size:28px}
.menu-item .n{font-weight:800;margin-top:6px;font-size:14px}
.menu-item .d{font-size:11.5px;color:var(--mut);margin-top:2px}
.backbtn{background:none;border:none;font-size:14px;font-weight:700;color:var(--tea);cursor:pointer;padding:4px 0;margin-bottom:8px;font-family:inherit}
textarea.inp{font-family:ui-monospace,monospace;min-height:130px;font-size:11.5px;line-height:1.4}
.warn-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:4px}
.warn-dot.low{background:#f59e0b}.warn-dot.high{background:#ef4444}
.plus-btn{position:sticky;bottom:86px;z-index:25;display:flex;justify-content:flex-end;pointer-events:none}
.plus-btn .fab{pointer-events:auto;background:var(--pri);color:#fff;border:none;border-radius:999px;padding:14px 20px;font-size:15px;font-weight:800;box-shadow:0 6px 18px rgba(234,88,12,.45);cursor:pointer;font-family:inherit}
.small-txt{font-size:12px;color:var(--mut)}
/* ============ AMÉLIORATIONS UX : professionnel & fluide ============ */
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
main#view{animation:viewIn .22s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card{box-shadow:0 1px 2px rgba(16,24,40,.05);transition:box-shadow .18s ease}
.btn{transition:transform .08s ease,background .18s ease,box-shadow .18s ease}
.btn:active{transform:scale(.97)}
.chip{transition:background .15s ease,color .15s ease,border-color .15s ease}
.menu-item{transition:transform .1s ease,box-shadow .18s ease;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.menu-item:active{transform:scale(.97)}
nav.bottom{box-shadow:0 -2px 14px rgba(16,24,40,.08)}
nav.bottom button{transition:color .15s ease}
nav.bottom button .ico{transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
nav.bottom button.on .ico{transform:scale(1.18)}
.overlay{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{box-shadow:0 -10px 34px rgba(16,24,40,.22)}
.toast{animation:tin .25s ease;box-shadow:0 8px 24px rgba(16,24,40,.28)}
.kpi{transition:transform .12s ease}
.kpi:active{transform:scale(.98)}
:focus-visible{outline:2px solid #0d9488;outline-offset:2px}
@media (hover:hover){
 .btn:hover{box-shadow:0 2px 8px rgba(16,24,40,.14)}
 .btn-pri:hover{background:var(--pri2)}
 .btn-ghost:hover{background:#e2e8f0}
 .card:hover{box-shadow:0 2px 10px rgba(16,24,40,.08)}
 .menu-item:hover{box-shadow:0 4px 14px rgba(16,24,40,.12)}
 .chip:hover{border-color:var(--tea);color:var(--tea)}
}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
/* ============ CODE D'ACCÈS (PIN) ============ */
.lock-ov{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#0d9488,#0f766e);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.lock-box{background:#fff;border-radius:20px;padding:24px 20px;text-align:center;width:100%;max-width:330px;box-shadow:0 18px 50px rgba(0,0,0,.3);animation:up .25s}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-top:6px}
.pin-dot{width:15px;height:15px;border-radius:50%;border:2px solid #cbd5e1;background:#fff;transition:all .12s ease}
.pin-dot.on{background:var(--tea);border-color:var(--tea);transform:scale(1.12)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pin-key{height:52px;border-radius:14px;border:1px solid var(--line);background:#f8fafc;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
.pin-key:active{background:#e2e8f0;transform:scale(.96)}
@media print{
 nav.bottom,header.top,.no-print,.plus-btn,.del,.fab{display:none!important}
 #print-root{display:block!important}
 body{padding:0;background:#fff}
 .wrap{max-width:100%;padding:0}
}
#print-root{display:none}
</style>
</head>
<body>
<header class="top">
 <div><div class="t1" id="bizname">Ma Boutique</div><div class="t2" id="today"></div></div>
 <div style="font-size:22px">🛒</div>
</header>
<main id="view" class="wrap"></main>
<nav class="bottom">
 <button id="nav-home" onclick="go('home')"><span class="ico">🏠</span>Accueil</button>
 <button id="nav-ventes" onclick="go('ventes')"><span class="ico">💰</span>Ventes</button>
 <button id="nav-depenses" onclick="go('depenses')"><span class="ico">🧾</span>Dépenses</button>
 <button id="nav-stock" onclick="go('stock')"><span class="ico">📦</span>Stock</button>
 <button id="nav-plus" onclick="go('plus')"><span class="ico">☰</span>Menu</button>
</nav>
<div id="lock-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="print-root"></div>
<script>
'use strict';
/* ============================ Utilitaires ============================ */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){n=Math.round(Number(n)||0);return n.toLocaleString('fr-FR')+' F'}
function fmtQty(q){q=Math.round(Number(q)*10)/10;return q.toLocaleString('fr-FR')}
function num(v){const x=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isNaN(x)?0:x}
function dISO(d){d=d||new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function fmtD(iso){if(!iso)return'';const p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function fmtDL(iso){if(!iso)return'';try{return new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}catch(e){return fmtD(iso)}}
function fmtTime(ts){try{return new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}catch(e){return''}}
const uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
/* Stockage : localStorage si possible, sinon mémoire (aperçu navigateur) */
let mem={};
const store=(function(){try{const k='__t__';localStorage.setItem(k,'1');localStorage.removeItem(k);return localStorage}catch(e){return{getItem:function(k){return (k in mem)?mem[k]:null},setItem:function(k,v){mem[k]=String(v)},removeItem:function(k){delete mem[k]}}}})();
const KEY='gboutique_v1';
function save(){try{store.setItem(KEY,JSON.stringify(DB))}catch(e){toast('⚠️ Sauvegarde automatique impossible ici')}scheduleSync()}

/* ============================ Données ============================ */
function seed(){
 return {
  v:1,
  settings:{businessName:'MISS KOUYATE SHOP',seuilPleines:3,seuilVides:12,consignes:{B6:10000,'B12.5':15000,B15:20000,B25:30000},prixAchat:{B6:2400,'B12.5':6600,B15:9000,B25:15000},welcomeDone:false,alloc:'sales',pinEveryOpen:true},
  activities:[
   {id:'g1',name:'Magasin de gaz 1',type:'gaz'},
   {id:'g2',name:'Magasin de gaz 2',type:'gaz'},
   {id:'f1',name:'Poisson & poulet braisés',type:'food'},
   {id:'m1',name:'Repas sur commande',type:'food'},
   {id:'gen',name:'Général (commun)',type:'gen'}
  ],
  products:[
   {id:'p1',act:'g1',name:'Recharge B6',price:2500,kind:'recharge',size:'B6'},
   {id:'p2',act:'g1',name:'Recharge B12.5',price:7000,kind:'recharge',size:'B12.5'},
   {id:'p3',act:'g1',name:'Bouteille B6 (vente définitive)',price:12500,kind:'definitive',size:'B6'},
   {id:'p4',act:'g1',name:'Bouteille B12.5 (vente définitive)',price:22000,kind:'definitive',size:'B12.5'},
   {id:'p5',act:'g1',name:'Accessoires (détendeur, tuyau…)',price:3000,kind:'normal'},
   {id:'p6',act:'g2',name:'Recharge B6',price:2500,kind:'recharge',size:'B6'},
   {id:'p7',act:'g2',name:'Recharge B12.5',price:7000,kind:'recharge',size:'B12.5'},
   {id:'p8',act:'g2',name:'Bouteille B6 (vente définitive)',price:12500,kind:'definitive',size:'B6'},
   {id:'p9',act:'g2',name:'Bouteille B12.5 (vente définitive)',price:22000,kind:'definitive',size:'B12.5'},
   {id:'p10',act:'g2',name:'Accessoires (détendeur, tuyau…)',price:3000,kind:'normal'},
   {id:'p11',act:'f1',name:'Poisson braisé',price:3000,kind:'normal'},
   {id:'p12',act:'f1',name:'Poulet braisé',price:4500,kind:'normal'},
   {id:'p13',act:'f1',name:'Poisson + attiéké',price:3500,kind:'normal'},
   {id:'p14',act:'f1',name:'Poulet + attiéké',price:5000,kind:'normal'},
   {id:'p15',act:'f1',name:'Boisson',price:500,kind:'normal'},
   {id:'p16',act:'m1',name:'Plat du jour',price:1500,kind:'normal'},
   {id:'p17',act:'m1',name:'Repas amélioré',price:2500,kind:'normal'},
   {id:'p18',act:'m1',name:'Repas événement / fête',price:3000,kind:'normal'},
   {id:'p19',act:'m1',name:'Boisson',price:500,kind:'normal'}
  ],
  cats:['Achat gaz','Achat bouteilles','Achat poisson','Achat poulet','Achat ingrédients','Charbon','Transport','Électricité','Eau','Loyer','Salaire','Taxe & patente','Emballage','Autre'],
  stockGaz:{},
  stockFood:{
   f1:[{id:'i1',name:'Poisson',unit:'kg',qty:0},{id:'i2',name:'Poulet',unit:'pièce',qty:0},{id:'i3',name:'Charbon',unit:'sac',qty:0},{id:'i4',name:'Huile',unit:'litre',qty:0},{id:'i5',name:'Attiéké',unit:'kg',qty:0},{id:'i6',name:'Emballage',unit:'paquet',qty:0}],
   m1:[{id:'i7',name:'Riz',unit:'kg',qty:0},{id:'i8',name:'Poisson',unit:'kg',qty:0},{id:'i9',name:'Poulet',unit:'pièce',qty:0},{id:'i10',name:'Huile',unit:'litre',qty:0},{id:'i11',name:'Tomate',unit:'panier',qty:0},{id:'i12',name:'Oignon',unit:'kg',qty:0}]
  },
  sales:[],expenses:[],cautions:[],payments:[],supplierCautions:[],moves:[],log:[]
 };
}
function normalizeDb(data){
 const S=seed();
 if(!data||typeof data.v!=='number')data=seed();
 if(!data.settings)data.settings=S.settings;
 if(data.settings.businessName==='Ma Boutique')data.settings.businessName='MISS KOUYATE SHOP';
 if(!data.settings.alloc)data.settings.alloc='sales';
 if(data.settings.pinEveryOpen===undefined)data.settings.pinEveryOpen=true;
 if(!data.settings.sync)data.settings.sync={url:'',key:'',pass:''};
 data.settings.consignes=Object.assign({},S.settings.consignes,data.settings.consignes||{});
 data.settings.prixAchat=Object.assign({},S.settings.prixAchat,data.settings.prixAchat||{});
 const legacyNames={'Bouteille B6 (client sans bouteille)':'Bouteille B6 (vente définitive)','Bouteille B12.5 (client sans bouteille)':'Bouteille B12.5 (vente définitive)','Bouteille B6 + consigne':'Bouteille B6 (vente définitive)','Bouteille B12.5 + consigne':'Bouteille B12.5 (vente définitive)'};
 data.products.forEach(function(p){if(p.kind==='bouteille'&&legacyNames[p.name]){p.kind='definitive';p.name=legacyNames[p.name];delete p.deposit}});
 if(!Array.isArray(data.cats)||!data.cats.length)data.cats=S.cats;
 if(!data.stockGaz)data.stockGaz={};
 if(!data.stockFood)data.stockFood={};
 if(!Array.isArray(data.sales))data.sales=[];
 if(!Array.isArray(data.expenses))data.expenses=[];
 if(!Array.isArray(data.cautions))data.cautions=[];
 if(!Array.isArray(data.payments))data.payments=[];
 if(!Array.isArray(data.supplierCautions))data.supplierCautions=[];
 if(!Array.isArray(data.moves))data.moves=[];
 if(!Array.isArray(data.log))data.log=[];
 return data;
}
let DB=null;
(function initDB(){
 let parsed=null;

function actName(id){const a=actById(id);return a?a.name:'—'}

function actColor(act){const i=DB.activities.findIndex(function(a){return a.id===act});const pal=['#0d9488','#2563eb','#d97706','#9333ea','#475569','#0891b2','#be185d'];return pal[((i%7)+7)%7]}

const MOVE_LABELS={
 'vente-recharge':['💰 Vente recharge (échange)','b-esp'],

function moveBadge(type){const t=MOVE_LABELS[type]||[type,'pill'];return '<span class="badge '+t[1]+'">'+t[0]+'</span>'}
function moveLabel(type){return (MOVE_LABELS[type]||[type])[0]}
function addMove(act,size,type,dp,dv,dc,label,note){
 if(!size)return;
 const st=stockOf(act,size);
 DB.moves.unshift({id:uid(),ts:Date.now(),date:dISO(),act:act,size:size,type:type,dp:dp,dv:dv,dc:dc,p:st.pleines,v:st.vides,c:st.cons,label:label||'',note:note||''});
 DB.moves=DB.moves.slice(0,2000);
}
function cautStockDelta(c,mult){
 if(!c||!c.qty||c.via==='chargement')return null;
 const d=((c.type==='in'?c.qty:-c.qty))*mult;
 return {act:c.act,size:c.size,state:c.state||'vides',d:d};
}
function applyCautStock(c,mult){
 const d=cautStockDelta(c,mult);
 if(!d)return null;
 const st=stockOf(d.act,d.size);
 if(d.state==='pleines')st.pleines+=d.d;else st.vides+=d.d;
 clampStock(d.act,d.size);
 return d;
}
/* Reconstruit l'historique des mouvements à partir des ventes, dépenses et consignations existantes */
function rebuildMoves(){
 const scratch={};
 const evs=[];
 DB.sales.forEach(function(s){if(s.effects&&s.effects.size)evs.push({ts:s.ts,kind:'sale',data:s})});
 DB.expenses.forEach(function(e){if(e.effects&&e.effects.size)evs.push({ts:e.ts,kind:'exp',data:e})});
 DB.supplierCautions.forEach(function(c){if(c.qty&&c.via!=='chargement'&&c.act&&c.size)evs.push({ts:c.ts,kind:'caut',data:c})});
 evs.sort(function(a,b){return a.ts-b.ts});
 const moves=[];
 evs.forEach(function(ev){
  if(ev.kind==='sale'){
   const s=ev.data;
   if(!scratch[s.effects.act])scratch[s.effects.act]={};
   const st=scratch[s.effects.act][s.effects.size]=scratch[s.effects.act][s.effects.size]||{pleines:0,vides:0,cons:0};
   st.pleines+=s.effects.p;st.vides+=s.effects.v;st.cons+=s.effects.c;
   st.pleines=Math.max(0,st.pleines);st.vides=Math.max(0,st.vides);st.cons=Math.max(0,st.cons);
   moves.push({ts:s.ts,date:s.date,act:s.effects.act,size:s.effects.size,type:(s.kind==='definitive')?'vente-definitive':(s.effects.c>0?'vente-bouteille':'vente-recharge'),dp:s.effects.p,dv:s.effects.v,dc:s.effects.c,p:st.pleines,v:st.vides,c:st.cons,label:s.name,note:s.client||''});
  }else if(ev.kind==='exp'){
   const e=ev.data;
   if(!scratch[e.effects.act])scratch[e.effects.act]={};
   const st=scratch[e.effects.act][e.effects.size]=scratch[e.effects.act][e.effects.size]||{pleines:0,vides:0,cons:0};
   st.pleines+=e.effects.p;st.vides+=e.effects.v;st.cons+=e.effects.c;
   st.pleines=Math.max(0,st.pleines);st.vides=Math.max(0,st.vides);st.cons=Math.max(0,st.cons);
   moves.push({ts:e.ts,date:e.date,act:e.effects.act,size:e.effects.size,type:e.effects.p>0?'chargement':'achat-vides',dp:e.effects.p,dv:e.effects.v,dc:e.effects.c,p:st.pleines,v:st.vides,c:st.cons,label:e.label||e.cat,note:e.note||''});
  }else if(ev.kind==='caut'){
   const c=ev.data;
   if(!scratch[c.act])scratch[c.act]={};
   const st=scratch[c.act][c.size]=scratch[c.act][c.size]||{pleines:0,vides:0,cons:0};
   const d=c.type==='in'?c.qty:-c.qty;
   if(c.state==='pleines')st.pleines+=d;else st.vides+=d;
   st.pleines=Math.max(0,st.pleines);st.vides=Math.max(0,st.vides);
   moves.push({ts:c.ts,date:c.date,act:c.act,size:c.size,type:c.type==='in'?'consignation-in':'consignation-out',dp:c.state==='pleines'?d:0,dv:c.state==='vides'?d:0,dc:0,p:st.pleines,v:st.vides,c:st.cons,label:c.supplier||'Fournisseur',note:c.note||''});
 }
 });
 moves.reverse();
 return moves.slice(0,2000);
}

function rangeFor(p){
 const now=new Date();let a=new Date(now),b=new Date(now);
 if(p==='day'){}
 else if(p==='yesterday'){a=b=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1)}
 else if(p==='week'){const d=(now.getDay()+6)%7;a=new Date(now.getFullYear(),now.getMonth(),now.getDate()-d)}
 else if(p==='month'){a=new Date(now.getFullYear(),now.getMonth(),1);b=new Date(now.getFullYear(),now.getMonth()+1,0)}
 else if(p==='lastmonth'){a=new Date(now.getFullYear(),now.getMonth()-1,1);b=new Date(now.getFullYear(),now.getMonth(),0)}
 else if(p==='all')return {};
 return {a:dISO(a),b:dISO(b)};
}
const rangeLabel={day:"Aujourd'hui",yesterday:'Hier',week:'Cette semaine',month:'Ce mois',lastmonth:'Mois dernier',all:'Toute la période'};
function customRange(pfx){
 if(state[pfx+'Range']==='custom'){
  const from=state[pfx+'From'],to=state[pfx+'To'];
  if(from&&to)return {a:from,b:to};
 }
 return rangeFor(state[pfx+'Range'])||{};
}
function rFor(pfx){
 const val=state[pfx+'Range'];
 if(val==='custom')return customRange(pfx);
 if(val==='today'||val==='day')return {a:dISO(),b:dISO()};
 if(val==='week')return rangeFor('week');
 return {};
}
function rangeLabelFor(pfx){
 if(state[pfx+'Range']==='custom')return state[pfx+'From']&&state[pfx+'To']?('du '+fmtD(state[pfx+'From'])+' au '+fmtD(state[pfx+'To'])):'période choisie';
 return rangeLabel[state[pfx+'Range']]||'';
}
function periodPicker(pfx,presets){
 presets=presets||[['day',"Aujourd'hui"],['week','Cette semaine'],['month','Ce mois'],['all','Tout']];
 const cur=state[pfx+'Range']||presets[0][0];

 if(cur==='custom'){

 }

}

function inR(iso,a,b){if(!a&&!b)return true;if(a&&iso<a)return false;if(b&&iso>b)return false;return true}
function stats(a,b){
 const r={ventes:0,dep:0,charges:0,cmv:0,achatsStock:0,enc:0,cred:0,credEnc:0,by:{}};
 DB.activities.forEach(function(x){r.by[x.id]={name:x.name,v:0,d:0,ch:0,stock:0,cmv:0}});
 DB.sales.forEach(function(s){
  if(!inR(s.date,a,b))return;
  r.ventes+=s.total;
  if(s.pay==='credit')r.cred+=s.total;else r.enc+=s.total;
  if(r.by[s.act])r.by[s.act].v+=s.total;
  const p=prodById(s.prod);
  const kind=(p&&p.kind)||s.kind;
  const sz=(p&&p.size)||(s.effects&&s.effects.size);
  if(sz&&(kind==='recharge'||kind==='definitive'||kind==='bouteille')){
   const gz=(DB.settings.prixAchat||{})[sz]||0;
   let c=s.qty*gz;
   if(kind!=='recharge')c+=s.qty*bottleAvgCost(s.act,sz);
   r.cmv+=c;
   if(r.by[s.act])r.by[s.act].cmv+=c;
  }
 });
 DB.expenses.forEach(function(e){
  if(!inR(e.date,a,b))return;
  r.dep+=e.amount;
  const isStock=(e.cat==='Achat gaz'||e.cat==='Achat bouteilles');
  if(isStock){r.achatsStock+=e.amount;if(r.by[e.act])r.by[e.act].stock+=e.amount}
  else{r.charges+=e.amount;if(r.by[e.act])r.by[e.act].ch+=e.amount}
  if(r.by[e.act])r.by[e.act].d+=e.amount;
 });
 DB.payments.forEach(function(p){if(inR(p.date,a,b))r.credEnc+=p.amount});
 r.ben=r.ventes-r.cmv-r.charges;
 return r;
}
function debts(){
 const m={};
 DB.sales.forEach(function(s){if(s.pay==='credit'&&s.client)m[s.client]=(m[s.client]||0)+s.total});
 DB.payments.forEach(function(p){m[p.client]=(m[p.client]||0)-p.amount});
 return Object.keys(m).map(function(n){return {name:n,due:m[n]}}).filter(function(x){return x.due>=1}).sort(function(x,y){return y.due-x.due});
}
function bottleAvgCost(act,size){
 let tot=0,q=0;
 DB.expenses.forEach(function(e){if(e.cat==='Achat bouteilles'&&e.effects&&e.effects.act===act&&e.effects.size===size){tot+=e.amount;q+=Math.abs(e.effects.v||0)}});
 return q>0?Math.round(tot/q):0;
}
function stockValueGaz(){
 let v=0;
 gazActs().forEach(function(a){sizes().forEach(function(sz){const st=stockOf(a.id,sz);v+=st.pleines*((DB.settings.prixAchat||{})[sz]||0)+st.vides*bottleAvgCost(a.id,sz)})});
 return Math.round(v);
}
function salePriceForSize(act,size){
 const p=DB.products.find(function(x){return x.act===act&&x.size===size&&x.kind==='recharge'})||DB.products.find(function(x){return x.act===act&&x.size===size});
 return p?p.price:0;
}
function stockValueSale(){
 let v=0;
 gazActs().forEach(function(a){sizes().forEach(function(sz){const st=stockOf(a.id,sz);v+=st.pleines*salePriceForSize(a.id,sz)+st.vides*bottleAvgCost(a.id,sz)})});
 return Math.round(v);
}
function stockRecap(act,size){
 const st=stockOf(act,size);
 const pa=(DB.settings.prixAchat||{})[size]||0;
 const avg=bottleAvgCost(act,size);
 const va=Math.round(st.pleines*pa+st.vides*avg);
 const vv=Math.round(st.pleines*salePriceForSize(act,size)+st.vides*avg);
 return size+' : '+st.pleines+' pleine(s), '+st.vides+' vide(s) · valeur achat '+money(va)+' · valeur vente '+money(vv);
}
function suppCautBal(){return DB.supplierCautions.reduce(function(t,c){return t+(c.type==='in'?c.amount:-c.amount)},0)}
function tops(a,b){
 const m={};
 DB.sales.forEach(function(s){if(!inR(s.date,a,b))return;if(!m[s.name])m[s.name]={n:s.name,q:0,t:0};m[s.name].q+=s.qty;m[s.name].t+=s.total});
 return Object.keys(m).map(function(k){return m[k]}).sort(function(x,y){return y.t-x.t});
}
function catsStats(a,b){

 DB.expenses.forEach(function(e){if(!inR(e.date,a,b))return;m[e.cat]=(m[e.cat]||0)+e.amount});

}

  '<div class="grid2"><div class="field"><label>Activité (magasin de gaz)</label><select class="inp" id="cf_act" onchange="calcCautConseq()">'+(acts.length?acts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>'}).join(''):'<option value="">— aucun magasin de gaz —</option>')+'</select></div>'+

   const act=val('cf_act'),sz=val('cf_size'),qty=Math.max(0,Math.round(num(val('cf_qty')))),state=val('cf_state');

   if(qty>0&&act){

     logStock(act,'Consignation '+(type==='in'?'+':'−')+qty+' bouteille(s) '+sz+' ('+sup+')');
    }

   save();toast((type==='in'?'Consignation enregistrée ✓':'Remboursement enregistré ✓')+crecap);render();return true;

}
function calcCautConseq(){
 const el=document.getElementById('cf_conseq');if(!el)return;
 const q=Math.max(0,Math.round(num(val('cf_qty'))));
 if(q<=0){el.innerHTML='<div class="hint" style="margin-top:8px">📦 Aucun changement de stock (quantité à 0) — seule l\'écriture d\'argent est enregistrée.</div>';return}
 const act=val('cf_act'),sz=val('cf_size'),state=val('cf_state');
 if(!act){el.innerHTML='<div class="hint" style="margin-top:8px">📦 Aucun changement de stock (aucun magasin de gaz sélectionné).</div>';return}
 const st=stockOf(act,sz);
 const cur=state==='pleines'?st.pleines:st.vides;
 const next=(curCautType==='in')?cur+q:Math.max(0,cur-q);
 const lab=state==='pleines'?'Pleines':'Vides';
 el.innerHTML='<div class="alert'+(curCautType==='in'?'':' ok')+'" style="margin-top:8px">📦 <b>Conséquence :</b> '+(curCautType==='in'?'Consignation versée → +'+q+' bouteille(s) '+sz+' ('+lab+' : '+cur+' → '+next+').':'Restitution → −'+q+' bouteille(s) '+sz+' ('+lab+' : '+cur+' → '+next+').')+'</div>';
}
function delCaut(id){
 const c=DB.supplierCautions.find(function(x){return x.id===id});if(!c)return;
 confirmModal('Supprimer cette consignation ?','Le total sera recalculé, et le stock de bouteilles sera remis comme avant si des bouteilles étaient liées.',function(){
  if(c.qty&&c.act){const d=applyCautStock(c,-1);if(d){const dp=(c.state==='pleines')?d.d:0,dv=(c.state==='vides')?d.d:0;addMove(c.act,c.size,'annulation-consignation',dp,dv,0,'Annulation consignation ('+(c.supplier||'Fournisseur')+')','')}}
  DB.supplierCautions=DB.supplierCautions.filter(function(x){return x.id!==id});
  save();render();
 });
}

function openPerte(act){
 curPerteAct=act;
 openModal('🔥 Perte / casse — '+esc(actName(act)),
  '<div class="hint">Enregistre ici les bouteilles <b>perdues, cassées ou volées</b> : elles sortent du stock définitivement.</div>'+
  '<div class="grid2"><div class="field"><label>Taille</label><select class="inp" id="p_size" onchange="calcPerteConseq()">'+sizes().map(function(sz){return '<option value="'+sz+'">'+sz+'</option>'}).join('')+'</select></div>'+
  '<div class="field"><label>Quantité ★</label><input class="inp" id="p_q" type="text" inputmode="decimal" value="1" oninput="calcPerteConseq()"></div>'+
  '<div class="field"><label>État</label><select class="inp" id="p_state" onchange="calcPerteConseq()"><option value="pleines">Pleines</option><option value="vides">Vides</option></select></div></div>'+
  '<div id="p_conseq"></div>'+
  '<div class="field"><label>Note (facultatif)</label><input class="inp" id="p_note" placeholder="Ex : bouteille cassée au transport"></div>',
  {primary:'Enregistrer la perte',onSubmit:function(){
   const sz=val('p_size'),q=Math.max(0,Math.round(num(val('p_q')))),state=val('p_state');
   if(q<=0){toast('Mets la quantité');return false}
   const st=stockOf(act,sz);
   let dp=0,dv=0,dc=0;
   if(state==='pleines'){dp=-q;st.pleines=Math.max(0,st.pleines-q)}
   else if(state==='vides'){dv=-q;st.vides=Math.max(0,st.vides-q)}
   else{dc=-q;st.cons=Math.max(0,st.cons-q)}
   addMove(act,sz,'perte',dp,dv,dc,'Perte / casse : −'+q+' '+sz,val('p_note').trim());
   logStock(act,'Perte : −'+q+' bouteille(s) '+sz);
   save();toast('Perte enregistrée ✓ · '+stockRecap(act,sz));render();return true;
  }});
 calcPerteConseq();
}
function calcPerteConseq(){
 const el=document.getElementById('p_conseq');if(!el)return;
 const q=Math.max(0,Math.round(num(val('p_q'))));
 if(q<=0){el.innerHTML='';return}
 const sz=val('p_size'),state=val('p_state');const st=stockOf(curPerteAct,sz);
 const labels={pleines:'Pleines',vides:'Vides'};
 const cur=state==='pleines'?st.pleines:(state==='vides'?st.vides:st.cons);
 el.innerHTML='<div class="alert" style="margin-top:8px">📦 <b>Conséquence :</b> '+labels[state]+' : '+cur+' → '+Math.max(0,cur-q)+' · Total en main : <b>−'+q+'</b> bouteille(s). Cette perte est définitive.</div>';
}

/* ============================ COMPTABILITÉ ANALYTIQUE ============================ */
function analytic(r){
 const s=stats(r.a,r.b);
 const biz=bizActs();
 const rows=biz.map(function(a){const b=s.by[a.id];const marge=b.v-b.cmv-b.ch;return {id:a.id,name:a.name,v:b.v,cmv:b.cmv,d:b.ch,m:marge}});
 const common=(s.by.gen?s.by.gen.ch:0);
 const alloc=DB.settings.alloc||'sales';
 const totalV=rows.reduce(function(t,x){return t+x.v},0);
 rows.forEach(function(x){x.com=0});
 if(alloc==='sales'&&totalV>0){rows.forEach(function(x){x.com=Math.round(common*x.v/totalV)})}
 else if(alloc==='equal'&&rows.length){const part=Math.floor(common/rows.length);rows.forEach(function(x){x.com=part});const rest=common-part*rows.length;if(rest>0)rows[0].com+=rest}
 rows.forEach(function(x){x.net=x.m-x.com;x.pct=(x.v>0?Math.round(x.m/x.v*100):0)});
 return {rows:rows,common:common,totalV:totalV,s:s,alloc:alloc};
}
function viewAnalytique(){
 const r=customRange('a');
 const a=analytic(r);
 const best=a.rows.slice().sort(function(x,y){return y.net-x.net})[0];
 const seg=[['sales','Au prorata des ventes'],['equal','À parts égales'],['none','Pas de répartition']].map(function(x){return '<button class="chip'+(a.alloc===x[0]?' on':'')+'" onclick="DB.settings.alloc=\''+x[0]+'\';save();render()">'+x[1]+'</button>'}).join('');
 const rows=a.rows.map(function(x){
  const isBest=best&&best.id===x.id&&a.rows.length>1;
  return '<tr'+(isBest?' style="background:#f0fdfa"':'')+'><td><b>'+(isBest?'⭐ ':'')+esc(x.name)+'</b></td>'+
  '<td style="text-align:right">'+money(x.v)+'</td>'+
  '<td style="text-align:right">'+(x.cmv>0?money(x.cmv):'—')+'</td>'+
  '<td style="text-align:right">'+money(x.d)+'</td>'+
  '<td style="text-align:right;font-weight:800;color:'+(x.m>=0?'var(--grn)':'var(--red)')+'">'+money(x.m)+'</td>'+
  '<td style="text-align:right">'+(x.v===0?'—':x.pct+' %')+'</td>'+
  '<td style="text-align:right">'+(a.alloc==='none'?'—':money(x.com))+'</td>'+
  '<td style="text-align:right;font-weight:800;color:'+(x.net>=0?'var(--grn)':'var(--red)')+'">'+money(x.net)+'</td></tr>';
 }).join('');
 return viewSub('🧮 Rentabilité par activité',

/* Aperçu de conséquence AVANT d'enregistrer une vente */
function calcSaleConseq(){
 const el=document.getElementById('s_conseq');if(!el)return;
 const p=prodById(curSalePid);if(!p){el.innerHTML='';return}
 const q=Math.max(0,Math.round(num(val('s_qty'))));
 if(q<=0){el.innerHTML='';return}
 const st=(p.size&&actById(p.act))?stockOf(p.act,p.size):null;
 if(p.kind==='recharge'&&st){
  const nP=Math.max(0,st.pleines-q);
  const warn=st.pleines<q?'<div class="small-txt" style="color:var(--red);margin-top:4px">⚠️ Attention : pas assez de pleines en stock ('+st.pleines+' seulement).</div>':'';
  el.innerHTML='<div class="alert ok" style="margin-top:8px">📦 <b>Conséquence (échange client) :</b> le client apporte sa bouteille vide et repart avec une pleine.<br><span class="small-txt">Pleines : '+st.pleines+' → '+nP+' · Vides : '+st.vides+' → '+(st.vides+q)+' · <b>Total bouteilles en main : inchangé</b> ('+(st.pleines+st.vides+st.cons)+').</span>'+warn+'</div>';
 }else if(p.kind==='definitive'&&st){
  const nP2=Math.max(0,st.pleines-q);
  const warn2=st.pleines<q?'<div class="small-txt" style="color:var(--red);margin-top:4px">⚠️ Attention : pas assez de pleines en stock ('+st.pleines+' seulement).</div>':'';
  el.innerHTML='<div class="alert" style="margin-top:8px">📦 <b>Conséquence (vente définitive) :</b> le client achète la bouteille, elle sort <b>définitivement</b> du stock.<br><span class="small-txt">Pleines : '+st.pleines+' → '+nP2+' · <b>Total en main : −'+q+'</b> ('+(st.pleines+st.vides+st.cons)+' → '+(nP2+st.vides+st.cons)+').</span>'+warn2+'</div>';
 }else{
  el.innerHTML='<div class="alert ok" style="margin-top:8px">📦 Aucun effet sur le stock de bouteilles (vente simple).</div>';
 }
 if(st&&p.size&&q>0&&(p.kind==='recharge'||p.kind==='definitive'||p.kind==='bouteille')){
  const pa=(DB.settings.prixAchat||{})[p.size]||0;
  const avg=bottleAvgCost(p.act,p.size);
  const sp=salePriceForSize(p.act,p.size);
  const nP=Math.max(0,st.pleines-q);
  const nV=(p.kind==='recharge')?st.vides+q:st.vides;
  const va=Math.round(nP*pa+nV*avg),vv=Math.round(nP*sp+nV*avg);
  el.innerHTML+='<div class="small-txt" style="margin-top:6px;border-top:1px dashed var(--line);padding-top:6px">💰 <b>Valeur du stock après la vente</b> : achat <b>'+money(va)+'</b> · vente <b>'+money(vv)+'</b>'+(vv>va?' · marge potentielle <b>'+money(vv-va)+'</b>':'')+'</div>';
 }
}

 curPay=p;
 const segs=document.querySelectorAll('#modal-root .seg button');
 for(let i=0;i<segs.length;i++)segs[i].classList.remove('on');
 const map={esp:'payEsp',mm:'payMm',credit:'payCr'};

function saveSale(pid){
 const p=prodById(pid);if(!p)return false;
 const q=Math.max(0,num(val('s_qty'))),price=num(val('s_price')),date=val('s_date')||dISO(),client=val('s_client').trim(),note=val('s_note').trim();
 if(q<=0){toast('Mets une quantité');return false}
 if(curPay==='credit'&&!client){toast('Écris le nom du client (crédit)');return false}
 /* Règle : pas de stock → pas de vente (recharge ou vente de bouteille) */
 if(p.size&&(p.kind==='recharge'||p.kind==='definitive'||p.kind==='bouteille')){
  const st=stockOf(p.act,p.size);
  if(st.pleines<q){toast('❌ Vente impossible : pas assez de stock — '+st.pleines+' bouteille(s) '+p.size+' pleine(s) en magasin.');return false}
 }
 const s={id:uid(),ts:Date.now(),date:date,act:p.act,name:p.name,prod:p.id,qty:q,price:price,pay:curPay,client:curPay==='credit'?client:'',note:note,total:Math.round(q*price),kind:p.kind};
 if(p.kind==='recharge'&&p.size){s.effects={act:p.act,size:p.size,p:-q,v:q,c:0};applyEf(s.effects,1);addMove(p.act,p.size,'vente-recharge',-q,q,0,p.name,client||note);}
 else if(p.kind==='definitive'&&p.size){s.effects={act:p.act,size:p.size,p:-q,v:0,c:0};applyEf(s.effects,1);addMove(p.act,p.size,'vente-definitive',-q,0,0,p.name,client||note);}
 DB.sales.unshift(s);let recap='';if(s.effects&&s.effects.size)recap=' · '+stockRecap(s.effects.act,s.effects.size);save();toast('Vente enregistrée ✓'+recap);render();return true;
}

function calcChargementDiff(){
 const el=document.getElementById('c_diff'),wrap=document.getElementById('c_cons_wrap');
 if(!el)return;
 const N=Math.max(0,Math.round(num(val('c_p')))),M=Math.max(0,Math.round(num(val('c_v'))));
 const diff=N-M;
 /* Montant auto : pleines reçues × prix d'achat (si pas modifié à la main) */
 const amtEl=document.getElementById('c_amt');
 if(amtEl&&N>0&&amtEl.dataset.touched!=='1'){
  const sz2=val('c_size');const pa=(DB.settings.prixAchat||{})[sz2]||0;
  amtEl.value=String(Math.round(N*pa));
 }
 if(N===0&&M===0){el.innerHTML='';if(wrap)wrap.style.display='none';return}
 let stockInfo='';
 if(curChargAct){
  const sz=val('c_size');const st=stockOf(curChargAct,sz);
  const nP=Math.max(0,st.pleines+N),nV=Math.max(0,st.vides-M);
  const pa=(DB.settings.prixAchat||{})[sz]||0,avg=bottleAvgCost(curChargAct,sz),sp=salePriceForSize(curChargAct,sz);
  const va=Math.round(nP*pa+nV*avg),vv=Math.round(nP*sp+nV*avg);
  stockInfo='<div class="small-txt" style="margin-top:4px">📦 Stock après : Pleines '+st.pleines+' → '+nP+' · Vides '+st.vides+' → '+nV+' · Total : '+(st.pleines+st.vides)+' → '+(nP+nV)+'</div><div class="small-txt">💰 Valeur après : achat <b>'+money(va)+'</b> · vente <b>'+money(vv)+'</b>'+(vv>va?' · marge potentielle <b>'+money(vv-va)+'</b>':'')+'</div>';
 }
 if(diff>0)el.innerHTML='<div class="alert" style="margin-top:8px">📦 Tu gardes <b>'+diff+'</b> bouteille(s) de plus que tu n\'en rends → <b>nouvelle consignation fournisseur</b> (+'+diff+' bouteilles en main, consignation à verser au dépôt).</div>'+stockInfo;
 else if(diff<0)el.innerHTML='<div class="alert ok" style="margin-top:8px">📦 Tu rends <b>'+(-diff)+'</b> bouteille(s) de plus que tu n\'en reçois → <b>restitution de consignation</b> (le dépôt te rembourse la consignation de '+(-diff)+' bouteilles).</div>'+stockInfo;
 else el.innerHTML='<div class="alert ok" style="margin-top:8px">✅ Échange équilibré : '+N+' pleine(s) reçue(s) = '+M+' vide(s) rendue(s). Aucune consignation à modifier.</div>'+stockInfo;
 if(wrap)wrap.style.display=diff===0?'none':'';
}

/* ============================ SYNCHRONISATION EN LIGNE ============================ */
function isSyncConfigured(){const s=DB.settings.sync;return !!(s&&s.url&&s.key&&s.pass)}
function syncHeaders(s){return {'apikey':s.key,'Authorization':'Bearer '+s.key,'Content-Type':'application/json'}}
function genSyncPass(){let s='';const chars='abcdef0123456789';for(let i=0;i<32;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s}
function setSyncStatus(r){try{store.setItem(KEY+'_sync',JSON.stringify({ok:!!r.ok,ts:r.ts||null,when:Date.now(),why:r.why||''}))}catch(e){}}
function syncStatus(){try{return JSON.parse(store.getItem(KEY+'_sync')||'null')}catch(e){return null}}
async function cloudPush(){
 const s=DB.settings.sync;
 if(!isSyncConfigured())return {ok:false,why:'Synchronisation non configurée'};
 const base=String(s.url).replace(/\/+$/,'');
 const body={key:'data_'+s.pass,value:{ts:Date.now(),data:DB},updated_at:new Date().toISOString()};
 try{
  const res=await fetch(base+'/rest/v1/shop_data?on_conflict=key',{method:'POST',headers:Object.assign(syncHeaders(s),{'Prefer':'resolution=merge-duplicates'}),body:JSON.stringify(body)});
  if(!res.ok)throw new Error('Erreur HTTP '+res.status);
  return {ok:true,ts:Date.now()};
 }catch(e){return {ok:false,why:'Hors ligne ou erreur ('+String(e).slice(0,90)+')'}}
}
async function cloudPull(){
 const s=DB.settings.sync;
 if(!isSyncConfigured())return {ok:false,why:'Synchronisation non configurée'};
 const base=String(s.url).replace(/\/+$/,'');
 try{
  const res=await fetch(base+'/rest/v1/shop_data?key=eq.data_'+encodeURIComponent(s.pass)+'&select=value&limit=1',{headers:syncHeaders(s)});
  if(!res.ok)throw new Error('Erreur HTTP '+res.status);
  const arr=await res.json();
  if(!arr||!arr.length||!arr[0]||!arr[0].value)return {ok:false,why:'Aucune donnée en ligne pour l\'instant'};
  const remote=arr[0].value;
  const prev=syncStatus();
  if(prev&&prev.ok&&prev.ts&&Number(remote.ts)<=Number(prev.ts))return {ok:true,ts:prev.ts,why:'déjà à jour'};
  try{store.setItem(KEY+'_pre_sync_'+Date.now(),JSON.stringify(DB))}catch(e){}
  const hadMoves=Array.isArray(remote.data&&remote.data.moves);
  DB=normalizeDb(remote.data);
  DB.settings.sync={url:s.url,key:s.key,pass:s.pass};
  if(!hadMoves&&(DB.sales.length||DB.supplierCautions.length))DB.moves=rebuildMoves();
  save();render();
  return {ok:true,ts:Number(remote.ts)||Date.now()};
 }catch(e){return {ok:false,why:'Hors ligne ou erreur ('+String(e).slice(0,90)+')'}}
}
let syncT=null;
function scheduleSync(){
 if(!isSyncConfigured())return;
 clearTimeout(syncT);
 syncT=setTimeout(function(){
  if(typeof navigator!=='undefined'&&navigator.onLine===false)return;
  cloudPush().then(function(r){if(r.ok)setSyncStatus(r)});
 },1200);
}
async function cloudDelete(){
 const s=DB.settings.sync;
 if(!isSyncConfigured()){toast('Synchronisation non configurée');return}
 toast('🗑 Suppression de la copie en ligne…');
 try{
  const base=String(s.url).replace(/\/+$/,'');
  const res=await fetch(base+'/rest/v1/shop_data?key=eq.data_'+encodeURIComponent(s.pass),{method:'DELETE',headers:syncHeaders(s)});
  if(!res.ok)throw new Error('HTTP '+res.status);
  try{store.removeItem(KEY+'_sync')}catch(e){}
  toast('✅ Copie en ligne supprimée — cet appareil garde toutes ses données');
 }catch(e){toast('⚠️ Suppression impossible : '+String(e).slice(0,80))}
}
function askDeleteCloud(){
 confirmModal('🗑 Supprimer les données EN LIGNE ?','Cela supprime UNIQUEMENT la copie dans le coffre-fort en ligne. Les données de CET appareil restent intactes, et seront renvoyées en ligne à la prochaine synchronisation. À utiliser seulement pour repartir de zéro en ligne.',function(){cloudDelete()},'Oui, supprimer en ligne');
}
function syncNow(){
 if(!isSyncConfigured()){toast('Configure d\'abord la synchronisation (champs ci-dessus)');return}
 toast('📤 Envoi en cours…');
 cloudPush().then(function(r){setSyncStatus(r);toast(r.ok?'✅ Sauvegarde en ligne réussie':'⚠️ '+r.why);render()});
}
function pullNow(){
 if(!isSyncConfigured()){toast('Configure d\'abord la synchronisation (champs ci-dessus)');return}
 toast('📥 Récupération…');
 cloudPull().then(function(r){setSyncStatus(r);toast(r.ok?'✅ Données récupérées':'⚠️ '+r.why);if(r.ok&&r.ts)render()});
}
function saveSyncConfig(){

window.addEventListener('online',function(){

  cloudPull().then(function(r){if(r.ok&&r.ts){setSyncStatus(r);render()}});
  cloudPush().then(function(r){if(r.ok)setSyncStatus(r)});
 }
});

function download(name,content,type){

  const blob=new Blob([content],{type:type||'application/octet-stream'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();

function doRestore(ev){
 const f=ev.target.files&&ev.target.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=function(){
  try{
   const obj=JSON.parse(rd.result);
   const data=obj&&obj.db?obj.db:obj;
   if(!data||!Array.isArray(data.sales)||!Array.isArray(data.activities)){toast('❌ Fichier de sauvegarde invalide');return}
   const syncCfg=DB.settings.sync||{url:'',key:'',pass:''};
   const hadMoves=Array.isArray(data.moves);
   DB=normalizeDb(data);
   DB.settings.sync=syncCfg;
   if(!hadMoves&&(DB.sales.length||DB.supplierCautions.length))DB.moves=rebuildMoves();
   save();render();toast('Sauvegarde restaurée ✓');
  }catch(e){toast('❌ Impossible de lire ce fichier')}
 };
 rd.readAsText(f);
 ev.target.value='';
}

/* ============================ EXPORT EXCEL (.xlsx) ============================ */
/* Génère un vrai classeur .xlsx (zip OOXML) rempli avec toutes les données,
   sans dépendance externe — fonctionne même hors connexion. */
function xlXmlE(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function xlDateSerial(iso){const t=Date.parse((iso||dISO())+'T00:00:00Z');return Math.round(t/86400000)+25569}
function xlCol(n){return String.fromCharCode(64+n)}
function xlS(ref,text,style){return '<c r="'+ref+'"'+(style!==undefined?' s="'+style+'"':'')+' t="inlineStr"><is><t xml:space="preserve">'+xlXmlE(text)+'</t></is></c>'}
function xlN(ref,val,style){const v=Number(val);return '<c r="'+ref+'"'+(style!==undefined?' s="'+style+'"':'')+'><v>'+(isNaN(v)?0:v)+'</v></c>'}
function xlF(ref,formula,style){return '<c r="'+ref+'"'+(style!==undefined?' s="'+style+'"':'')+'><f>'+xlXmlE(formula)+'</f></c>'}
function xlLit(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'}
function xlRow(r,cells){return '<row r="'+r+'">'+cells+'</row>'}
function xlCols(list){let x='';list.forEach(function(w,i){x+='<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>'});return x}
const XL_CRC=(function(){const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}return t})();
function xlCrc(u8){let crc=0xFFFFFFFF;for(let i=0;i<u8.length;i++)crc=(crc>>>8)^XL_CRC[(crc^u8[i])&0xFF];return (crc^0xFFFFFFFF)>>>0}
function xlEnc(s){return new TextEncoder().encode(s)}
function xlU16(v){return new Uint8Array([v&255,(v>>8)&255])}
function xlU32(v){return new Uint8Array([v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255])}
function xlZip(entries){
 const b=(function(){const parts=[];let len=0;return{push:function(u8){parts.push(u8);len+=u8.length},len:function(){return len},finish:function(){const out=new Uint8Array(len);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}}})();
 const d=new Date();
 const time=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF;
 const date=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
 const cd=[];
 entries.forEach(function(e){

/* ============================ Démo & reset ============================ */
function loadDemo(){
 /* Sécurité : si des vraies données existent, on les sauvegarde d'abord */
 try{
  if(DB.sales.length||DB.expenses.length||DB.supplierCautions.length||DB.payments.length){
   store.setItem(KEY+'_predemo',JSON.stringify(DB));
  }
 }catch(e){}
 const D=seed();
 D.settings.businessName='MISS KOUYATE SHOP';
 D.settings.welcomeDone=true;
 D.stockGaz={g1:{B6:{pleines:8,vides:5,cons:3},'B12.5':{pleines:12,vides:9,cons:6}},g2:{B6:{pleines:4,vides:2,cons:1},'B12.5':{pleines:6,vides:4,cons:2}}};
 D.stockFood={f1:[{id:'i1',name:'Poisson',unit:'kg',qty:6},{id:'i2',name:'Poulet',unit:'pièce',qty:4},{id:'i3',name:'Charbon',unit:'sac',qty:2},{id:'i4',name:'Huile',unit:'litre',qty:5},{id:'i5',name:'Attiéké',unit:'kg',qty:3},{id:'i6',name:'Emballage',unit:'paquet',qty:8}],m1:[{id:'i7',name:'Riz',unit:'kg',qty:15},{id:'i8',name:'Poisson',unit:'kg',qty:4},{id:'i9',name:'Poulet',unit:'pièce',qty:3},{id:'i10',name:'Huile',unit:'litre',qty:6},{id:'i11',name:'Tomate',unit:'panier',qty:2},{id:'i12',name:'Oignon',unit:'kg',qty:5}]};
 const R=function(a,b){return Math.floor(a+Math.random()*(b-a+1))};
 const findP=function(act,name){return D.products.find(function(p){return p.act===act&&p.name===name})};
 let base=Date.now();
 const addSale=function(daysAgo,act,pid,qty,pay,client,note,priceOverride){
  const date=dISO(new Date(Date.now()-daysAgo*86400000));
  const p=D.products.find(function(x){return x.id===pid});
  const price=priceOverride||p.price;
  const sale={id:uid(),ts:base-(daysAgo*86400000+R(1,80000000)),date:date,act:act,name:p.name,prod:pid,qty:qty,price:price,pay:pay,client:client||'',note:note||'',total:Math.round(qty*price),kind:p.kind};
  if(p.kind==='recharge'&&p.size)sale.effects={act:act,size:p.size,p:-qty,v:qty,c:0};
  else if(p.kind==='definitive'&&p.size)sale.effects={act:act,size:p.size,p:-qty,v:0,c:0};
  else if(p.kind==='bouteille'&&p.size)sale.effects={act:act,size:p.size,p:-qty,v:0,c:qty};
  D.sales.push(sale);
 };
 const addExp=function(daysAgo,act,cat,label,amount){
  D.expenses.push({id:uid(),ts:base-(daysAgo*86400000+R(1,80000000)),date:dISO(new Date(Date.now()-daysAgo*86400000)),act:act,cat:cat,label:label,amount:amount,note:''});
 };
 for(let i=13;i>=0;i--){
  const d=new Date(Date.now()-i*86400000);const dow=d.getDay();const we=dow===6||dow===0;
  /* Gaz 1 : tous les jours */
  const nb12=R(6,16),nb6=R(3,8);
  for(let k=0;k<nb12;k++)addSale(i,'g1',findP('g1','Recharge B12.5').id,1,'esp');
  for(let k=0;k<nb6;k++)addSale(i,'g1',findP('g1','Recharge B6').id,1,Math.random()<0.15?'mm':'esp');
  if(R(1,10)===3)addSale(i,'g1',findP('g1','Bouteille B6 (vente définitive)').id,1,'esp');
  if(R(1,12)===4)addSale(i,'g1',findP('g1','Bouteille B12.5 (vente définitive)').id,1,'esp');
  if(i%3===1){const e={id:uid(),ts:base-(i*86400000+R(1,80000000)),date:dISO(new Date(Date.now()-i*86400000)),act:'g1',cat:'Achat gaz',label:'Chargement dépôt (30 × B12.5 + 10 × B6)',amount:R(215000,235000),note:'',effects:{act:'g1',size:'B12.5',p:30,v:30,c:0}};D.expenses.push(e)}
  if(i===2)addExp(i,'g1','Transport','Transport chargement',2500);
  if(i===10)addExp(i,'g1','Taxe & patente','Taxe communale',15000);
  /* Gaz 2 : démarrage, plus petit */
  const nb12b=R(2,7),nb6b=R(1,4);
  for(let k=0;k<nb12b;k++)addSale(i,'g2',findP('g2','Recharge B12.5').id,1,'esp');
  for(let k=0;k<nb6b;k++)addSale(i,'g2',findP('g2','Recharge B6').id,1,'esp');
  if(i%3===0){const e={id:uid(),ts:base-(i*86400000+R(1,80000000)),date:dISO(new Date(Date.now()-i*86400000)),act:'g2',cat:'Achat gaz',label:'Chargement dépôt (12 × B12.5 + 5 × B6)',amount:R(95000,105000),note:'',effects:{act:'g2',size:'B12.5',p:12,v:12,c:0}};D.expenses.push(e)}
  if(i===8)addExp(i,'g2','Salaire','Salaire aide magasin',15000);
  /* Poisson & poulet braisés : le week-end */
  if(we){
   for(let k=0;k<R(10,16);k++)addSale(i,'f1',findP('f1','Poisson braisé').id,1,'esp');
   for(let k=0;k<R(5,9);k++)addSale(i,'f1',findP('f1','Poulet braisé').id,1,'esp');
   for(let k=0;k<R(3,7);k++)addSale(i,'f1',findP('f1','Poisson + attiéké').id,1,'esp');
   for(let k=0;k<R(2,5);k++)addSale(i,'f1',findP('f1','Boisson').id,1,'esp');
   addExp(i,'f1','Achat poisson','Poisson au marché',R(25000,35000));
   addExp(i,'f1','Achat poulet','Poulets fermiers',R(20000,30000));
   addExp(i,'f1','Charbon','Sac de charbon',2500);
  }
  /* Repas sur commande : jours de semaine */
  if(!we){
   const nb=R(2,6);
   for(let k=0;k<nb;k++)addSale(i,'m1',findP('m1','Plat du jour').id,1,'esp');
   if(R(1,4)===1)addSale(i,'m1',findP('m1','Repas amélioré').id,1,'mm');
   if(i%2===0)addExp(i,'m1','Achat ingrédients','Ingrédients (riz, poisson, condiments)',R(8000,15000));
  }
 }
 /* Crédits */
 addSale(1,'g1',findP('g1','Recharge B12.5').id,1,'credit','Aya K.','');
 addSale(3,'g1',findP('g1','Recharge B12.5').id,1,'credit','Aya K.','');
 addSale(4,'g1',findP('g1','Recharge B6').id,1,'credit','Yao D.','');
 addSale(5,'m1',findP('m1','Repas événement / fête').id,5,'credit','Mme Affoué','commande mariage');
 D.payments.push({id:uid(),ts:Date.now()-2*86400000,date:dISO(new Date(Date.now()-2*86400000)),client:'Aya K.',amount:7000,note:'acompte'});
 /* Consignations fournisseurs : déjà gérées plus bas */
 /* Consignations versées aux fournisseurs (argent immobilisé, pas des dépenses) */
 D.supplierCautions.push({id:uid(),ts:base-12*86400000,date:dISO(new Date(Date.now()-12*86400000)),supplier:'Dépôt Total (exemple)',type:'in',amount:300000,note:'40 bouteilles B12.5',act:'g1',size:'B12.5',qty:40,state:'vides',via:'direct'});
 D.supplierCautions.push({id:uid(),ts:base-9*86400000,date:dISO(new Date(Date.now()-9*86400000)),supplier:'Dépôt Oryx (exemple)',type:'in',amount:150000,note:'25 bouteilles B12.5',act:'g2',size:'B12.5',qty:25,state:'vides',via:'direct'});
 D.supplierCautions.push({id:uid(),ts:base-2*86400000,date:dISO(new Date(Date.now()-2*86400000)),supplier:'Dépôt Oryx (exemple)',type:'out',amount:50000,note:'retour de 8 bouteilles',act:'g2',size:'B12.5',qty:8,state:'vides',via:'direct'});
 D.log.unshift({ts:Date.now(),act:'g1',text:'Exemple : voici à quoi ressemble le journal des mouvements de stock.'});
 D.settings.sync=DB.settings.sync||{url:'',key:'',pass:''};
 DB=D;DB.moves=rebuildMoves();save();render();toast('Données d\'exemple chargées ✓ (15 jours)');
}

/* ============================ CODE D'ACCÈS (PIN) ============================ */
function pinHash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return 'p'+h.toString(36)}
function pinStored(){try{return store.getItem(KEY+'_pin')||''}catch(e){return ''}}
function pinIsSet(){return !!pinStored()}
function showLock(){
 const root=document.getElementById('lock-root');
 if(!root)return;
 if(!pinIsSet()){
  openModal('🔒 Code d\'accès','<div class="hint">Pour verrouiller l\'application, crée d\'abord ton code secret (4 à 6 chiffres).</div>',{primary:'Créer mon code',onSubmit:function(){openCreatePin();return false}});
  return;
 }
 let entered='';
 function render(){
  let dots='';
  for(let i=0;i<4;i++)dots+='<div class="pin-dot'+(entered.length>i?' on':'')+'"></div>';
  root.innerHTML='<div class="lock-ov"><div class="lock-box">'+
   '<div style="font-size:36px">🔒</div>'+
   '<div style="font-weight:800;font-size:17px;margin-top:6px">MISS KOUYATE SHOP</div>'+
   '<div class="small-txt" style="margin:4px 0 12px">Entre ton code secret</div>'+
   '<div class="pin-dots">'+dots+'</div>'+
   '<div id="pin-msg" style="min-height:18px;font-size:12.5px;color:var(--red);margin:4px 0"></div>'+
   '<div class="pin-pad">'+['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(function(k){return '<button class="pin-key" onclick="pinKey('+"'"+k+"'"+')">'+k+'</button>'}).join('')+'</div>'+
   '</div></div>';
 }
 function check(){
  if(pinHash(entered)===pinStored()){root.innerHTML='';toast('Bienvenue 👋')}
  else{entered='';render();const m=document.getElementById('pin-msg');if(m)m.textContent='Code incorrect, réessaie'}
 }
 window.pinKey=function(k){
  if(k==='C'){entered='';render();return}
  if(k==='⌫'){entered=entered.slice(0,-1);render();return}
  if(entered.length<4){entered+=k;render();if(entered.length===4)setTimeout(check,130)}
 };
 render();
}
function openCreatePin(){
 openModal('🔒 Choisis ton code secret',
  '<div class="hint">Ce code protégera l'+"'"+'accès à l'+"'"+'application sur cet appareil. Choisis 4 à 6 chiffres faciles pour toi (ex : une année). Tu pourras le changer dans Réglages.</div>'+
  '<div class="field"><label>Ton code (4 à 6 chiffres)</label><input class="inp" id="pin1" type="password" inputmode="numeric" maxlength="6" placeholder="••••"></div>'+
  '<div class="field"><label>Répète le code</label><input class="inp" id="pin2" type="password" inputmode="numeric" maxlength="6" placeholder="••••"></div>',
  {primary:'Enregistrer le code',onSubmit:function(){
   const a=val('pin1'),b=val('pin2');
   if(!/^[0-9]{4,6}$/.test(a)){toast('Mets 4 à 6 chiffres');return false}
   if(a!==b){toast('Les deux codes ne sont pas identiques');return false}
   try{store.setItem(KEY+'_pin',pinHash(a))}catch(e){}
   toast('✅ Code enregistré — garde-le bien !');return true;
  }});
}
function openChangePin(){
 openModal('🔒 Changer le code secret',
  '<div class="field"><label>Code actuel</label><input class="inp" id="pin_old" type="password" inputmode="numeric" maxlength="6"></div>'+
  '<div class="field"><label>Nouveau code (4 à 6 chiffres)</label><input class="inp" id="pin_n1" type="password" inputmode="numeric" maxlength="6" placeholder="••••"></div>'+
  '<div class="field"><label>Répète le nouveau code</label><input class="inp" id="pin_n2" type="password" inputmode="numeric" maxlength="6" placeholder="••••"></div>',
  {primary:'Changer',onSubmit:function(){
   if(pinHash(val('pin_old'))!==pinStored()){toast('Code actuel incorrect');return false}
   const a=val('pin_n1'),b=val('pin_n2');
   if(!/^[0-9]{4,6}$/.test(a)){toast('Mets 4 à 6 chiffres');return false}
   if(a!==b){toast('Les deux codes ne sont pas identiques');return false}
   try{store.setItem(KEY+'_pin',pinHash(a))}catch(e){}
   toast('✅ Code changé');return true;
  }});
}

 DB.settings.pinEveryOpen=DB.settings.pinEveryOpen===false;
